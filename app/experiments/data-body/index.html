<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the orb — data body</title>
<link rel="stylesheet" href="/src/styles/base.css">
<style>
  body { display:flex; flex-direction:column; overflow:hidden; height:100vh;
         background:#05060a; }
  .stage { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .note {
    position:absolute; left:18px; bottom:16px; color:var(--dim);
    font-size:11px; line-height:1.6; max-width:44ch; pointer-events:none;
  }
  .note b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
  <div class="stage"><canvas id="view"></canvas></div>
  <div class="note">
    The sphere is a cloud of points rather than a surface. Held still it
    breathes; <b>move it</b> — turn it, or carry it — and the field boils in
    proportion.<br>
    Turning also drags ripples through the cloud, against the way you turned.
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
