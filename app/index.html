<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the orb — experiments</title>
<link rel="stylesheet" href="/src/styles/base.css">
<style>
  main { padding:22px 20px 60px; max-width:1100px; margin:0 auto; }
  h2 {
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dim); margin:28px 0 12px; font-weight:600;
  }
  h2:first-child { margin-top:8px; }
  .grid {
    display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card {
    display:block; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:15px 16px 16px; transition:border-color .12s;
  }
  .card:hover { border-color:var(--ok); }
  .card h3 { margin:0 0 7px; font-size:14px; font-weight:600; }
  .card p { margin:0; color:var(--dim); font-size:12px; line-height:1.5; }
  .card .tag {
    display:inline-block; margin-top:11px; font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--bg); background:var(--ghost);
    padding:2px 7px; border-radius:3px;
  }
  .card.tool .tag { background:var(--z); }
  .card.experiment .tag { background:var(--ok); }
  .empty { color:var(--dim); }
  .lead { color:var(--dim); margin:0; max-width:70ch; }
  .lead code { color:var(--ink); }
</style>
</head>
<body>
  <div class="topbar">
    <h1>the orb</h1>
    <div class="stat" id="link">link <b>…</b></div>
  </div>
  <main>
    <p class="lead">
      Each experiment is its own page. Drop a folder into
      <code>app/experiments/</code> with an <code>index.html</code>,
      <code>main.js</code> and <code>meta.js</code> and it appears here — no
      registry to edit.
    </p>
    <div id="sections"></div>
  </main>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
